<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Reconstruction: Joey MIDlet — Main menu</title><link rel="stylesheet" href="j2me.css"></head><body>
<div class="stage">
<div id="shot" class="phone">
  <div class="earpiece"></div>
  <div class="screen">
    <!-- MainMenuView.java appends: mainmenu.view, mainmenu.preferences, then mainmenu.snapshot (only if polish.api.mmapi) -->
    <div class="title">Main menu</div>
    <div class="body" style="padding-top:0">
      <div class="menuentry focus">View uploads</div>
      <div class="menuentry">Preferences</div>
      <div class="menuentry">Take snapshot</div>
    </div>
    <div class="cmdbar"><span>Select</span><span>Exit</span></div>
  </div>
  <div class="softkeys"><span>&#9644;</span><span>&#9644;</span></div>
  <div class="navkey"></div>
  <div class="keypad"><span>1</span><span>2 abc</span><span>3 def</span><span>4 ghi</span><span>5 jkl</span><span>6 mno</span><span>7 pqrs</span><span>8 tuv</span><span>9 wxyz</span><span>*</span><span>0</span><span>#</span></div>
</div>
<div class="footnote">Reconstruction from source; not a capture of the original software.</div>
</div>
</body></html>
