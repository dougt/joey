<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Reconstruction: Joey title prompt (nsIPromptService)</title><link rel="stylesheet" href="ff.css">
<style>
body { padding: 20px; background: #6d8fc2; }
#shot { width: 440px; }
#shot .dialog { width: 440px; }
</style></head><body>
<div class="stage">
<div id="shot">
<div class="dialog">
  <div class="titlebar">Joey! Uploading..<span class="ctl"><span class="x">&#10005;</span></span></div>
  <div class="body">
    <!-- strings: joey.properties promptTitle.windowTitle / promptTitle.label / promptTitle.prefQuestion -->
    <div class="row" style="align-items:flex-start;gap:12px">
      <span style="width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9fc4ff,#1b57c7);display:inline-block;flex:none;color:#fff;font:bold 20px Tahoma;text-align:center;line-height:32px">?</span>
      <div style="flex:1">
        <div class="label" style="margin-bottom:6px">Edit page title</div>
        <input class="xp" style="width:100%" value="Kangaroo - Wikipedia, the free encyclopedia" readonly>
        <div class="checkbox" style="margin-top:8px"><i class="on"></i>Always ask to edit titles</div>
      </div>
    </div>
  </div>
  <div class="buttons"><button class="xp default">OK</button><button class="xp">Cancel</button></div>
</div>
</div>
<div class="footnote" style="position:static;margin-top:8px;color:#fff">Reconstruction from source; not a capture of the original software.</div>
</div>
</body></html>
