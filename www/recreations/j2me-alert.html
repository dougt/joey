<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Reconstruction: Joey MIDlet — delete confirmation</title><link rel="stylesheet" href="j2me.css">
<style>.thumb.a { background: linear-gradient(135deg,#c9a46a,#7d5a2c); } .thumb.b { background: linear-gradient(135deg,#5b8fd6,#1f3f7a); } .thumb.c { background: linear-gradient(135deg,#9ccf6a,#3c7a2a); }</style></head><body>
<div class="stage">
<div id="shot" class="phone">
  <div class="earpiece"></div>
  <div class="screen">
    <!-- ALERT_UPLOADS_DELETE_CONFIRMATION in JoeyController.java: Alert(uploads.delete.msg, CONFIRMATION) with CMD_YES / CMD_NO;
         .alertConfirmation style: white round-rect, bottom-centred, previous screen repainted behind -->
    <div class="dim">
      <div class="title">Uploads</div>
      <div class="body" style="padding:2px 2px 44px">
        <div class="uploadItem focus"><span class="thumb a"></span><span>Kangaroo - Wikipedia</span></div>
        <div class="uploadItem"><span class="thumb b"></span><span>Golden Gate at dusk</span></div>
        <div class="uploadItem"><span class="thumb c"></span><span>Mozilla Labs</span></div>
      </div>
    </div>
    <div class="alert">Do you really wanna delete this upload?</div>
    <div class="cmdbar"><span>Yes</span><span>No</span></div>
  </div>
  <div class="softkeys"><span>&#9644;</span><span>&#9644;</span></div>
  <div class="navkey"></div>
  <div class="keypad"><span>1</span><span>2 abc</span><span>3 def</span><span>4 ghi</span><span>5 jkl</span><span>6 mno</span><span>7 pqrs</span><span>8 tuv</span><span>9 wxyz</span><span>*</span><span>0</span><span>#</span></div>
</div>
<div class="footnote">Reconstruction from source; not a capture of the original software.</div>
</div>
</body></html>
