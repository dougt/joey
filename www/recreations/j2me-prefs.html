<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Reconstruction: Joey MIDlet — Preferences</title><link rel="stylesheet" href="j2me.css"></head><body>
<div class="stage">
<div id="shot" class="phone">
  <div class="earpiece"></div>
  <div class="screen">
    <!-- PreferencesView.java: title form.preferences; "Server" is an EXCLUSIVE ChoiceGroup (single-line radio with arrows)
         over joey.labs.mozilla.com / dougt.joey-dev.labs.mozilla.com / clouserw.joey-dev.labs.mozilla.com;
         "Update interval" is a DECIMAL TextField (default 300 seconds) -->
    <div class="title">Preferences</div>
    <div class="body">
      <div class="inputLabel">Server</div>
      <div class="radiobox focus"><span class="arrow">&#9664;</span><span>joey.labs.mozilla.com</span><span class="arrow">&#9654;</span></div>
      <div class="inputLabel">Update interval</div>
      <div class="input">300</div>
    </div>
    <div class="cmdbar"><span>Save</span><span>Back</span></div>
  </div>
  <div class="softkeys"><span>&#9644;</span><span>&#9644;</span></div>
  <div class="navkey"></div>
  <div class="keypad"><span>1</span><span>2 abc</span><span>3 def</span><span>4 ghi</span><span>5 jkl</span><span>6 mno</span><span>7 pqrs</span><span>8 tuv</span><span>9 wxyz</span><span>*</span><span>0</span><span>#</span></div>
</div>
<div class="footnote">Reconstruction from source; not a capture of the original software.</div>
</div>
</body></html>
