<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Reconstruction: Joey Uploads Manager popup (joeyStatus.js)</title><link rel="stylesheet" href="ff.css">
<style>
body { padding: 20px; }
#shot { width: 420px; height: 220px; position: relative; overflow: hidden; background: #fff; border: 1px solid #aca899; }
#shot .content { height: 197px; padding: 14px 18px; font: 13px Georgia, serif; color: #555; }
#shot .statusbar { position: absolute; left: 0; right: 0; bottom: 0; }
#shot .udmanager { left: 186px; top: 110px; width: 190px; }
</style></head><body>
<div class="stage">
<div id="shot">
  <div class="content"><p style="margin:0;line-height:1.5">Three items are in flight. The status-bar label shows the average progress; the popup (tooltip "Joey Uploads Manager") lists each one with its type icon.</p></div>
  <div class="statusbar">
    <span class="msg">Done</span>
    <span class="panel joey">
      <span class="udbox pressed">Joey: 66%</span>
      <span class="icon"><img src="assets/ff/joey16x16.png" alt="Joey"></span>
    </span>
    <span class="panel" style="width:100px"><span style="width:90px;height:12px;border:1px solid #aca899;background:#fff;display:inline-block"></span></span>
  </div>
  <!-- joeyUDManager popup; rows built by joeyStatusUpdateService.createProgressElement; status strings from joey.properties -->
  <div class="udmanager">
    <div class="joeyProgressLayer"><div class="joeyProgressMeter" style="width:100px"></div><label class="joeyTypeVideo">Upload completed</label></div>
    <div class="joeyProgressLayer"><div class="joeyProgressMeter" style="width:100px"></div><label class="joeyTypeAudio">Download completed</label></div>
    <div class="joeyProgressLayer"><div class="joeyProgressMeter" style="width:38px"></div><label class="joeyTypeText">Uploading...</label></div>
  </div>
</div>
<div class="footnote" style="position:static;margin-top:8px">Reconstruction from source; not a capture of the original software.</div>
</div>
</body></html>
