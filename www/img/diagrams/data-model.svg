<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1f1a">
  <title>Joey database schema (joey.sql)</title>
  <desc>Entity-relationship diagram of the MySQL tables plus the per-user upload directory layout.</desc>
  <defs>
    <marker id="crow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,8 L15,1 M0,8 L15,8 M0,8 L15,15" stroke="#4a4d44" stroke-width="1.5" fill="none"/>
    </marker>
    <marker id="one" viewBox="0 0 16 16" refX="12" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M8,2 L8,14" stroke="#4a4d44" stroke-width="1.8" fill="none"/>
    </marker>
  </defs>
  <rect width="1000" height="650" fill="#fbfbf7"/>

  <!-- relationship lines (drawn first, boxes cover their ends) -->
  <g stroke="#4a4d44" stroke-width="1.5" fill="none">
    <line x1="275" y1="185" x2="230" y2="95" marker-start="url(#crow)" marker-end="url(#one)"/>
    <line x1="275" y1="203" x2="230" y2="325" marker-start="url(#crow)" marker-end="url(#one)"/>
    <line x1="390" y1="380" x2="390" y2="284" marker-start="url(#crow)" marker-end="url(#one)"/>
    <path d="M500,415 L520,415 L520,95 L545,95" marker-start="url(#crow)" marker-end="url(#one)"/>
    <line x1="645" y1="300" x2="645" y2="230" marker-start="url(#crow)" marker-end="url(#one)"/>
    <line x1="790" y1="353" x2="745" y2="353" marker-start="url(#crow)" marker-end="url(#one)"/>
    <line x1="885" y1="300" x2="885" y2="248" marker-start="url(#crow)" marker-end="url(#one)"/>
  </g>

  <!-- phones -->
  <g>
    <rect x="20" y="60" width="210" height="188" rx="8" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
    <rect x="20" y="60" width="210" height="26" rx="8" fill="#1d1f1a"/>
    <rect x="20" y="74" width="210" height="12" fill="#1d1f1a"/>
    <text x="125" y="78" text-anchor="middle" fill="#b5d623" font-weight="700">phones</text>
    <g font-size="13">
      <text x="30" y="99">id</text><text x="222" y="99" text-anchor="end" fill="#7fa000" font-size="11" font-weight="700">PK</text>
      <text x="30" y="117">name</text>
      <text x="30" y="135">locale</text>
      <text x="30" y="153">jad_name</text>
      <text x="30" y="171">jar_name</text>
      <text x="30" y="189">screen_width</text>
      <text x="30" y="207">screen_height</text>
      <text x="30" y="225">screen_bitdepth</text>
      <text x="30" y="243">browser_ua</text>
    </g>
  </g>

  <!-- operators -->
  <g>
    <rect x="20" y="290" width="210" height="116" rx="8" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
    <rect x="20" y="290" width="210" height="26" rx="8" fill="#1d1f1a"/>
    <rect x="20" y="304" width="210" height="12" fill="#1d1f1a"/>
    <text x="125" y="308" text-anchor="middle" fill="#b5d623" font-weight="700">operators</text>
    <text x="30" y="329">id</text><text x="222" y="329" text-anchor="end" fill="#7fa000" font-size="11" font-weight="700">PK</text>
    <text x="30" y="347">provider</text>
    <text x="30" y="365">emaildomain</text><text x="222" y="365" text-anchor="end" fill="#7a7d73" font-size="11">SMS gateway</text>
    <text x="30" y="383">created</text>
    <text x="30" y="401">modified</text>
  </g>

  <!-- users -->
  <g>
    <rect x="275" y="60" width="225" height="224" rx="8" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
    <rect x="275" y="60" width="225" height="26" rx="8" fill="#1d1f1a"/>
    <rect x="275" y="74" width="225" height="12" fill="#1d1f1a"/>
    <text x="387" y="78" text-anchor="middle" fill="#b5d623" font-weight="700">users</text>
    <text x="285" y="99">id</text><text x="492" y="99" text-anchor="end" fill="#7fa000" font-size="11" font-weight="700">PK</text>
    <text x="285" y="117">username</text><text x="492" y="117" text-anchor="end" fill="#7a7d73" font-size="11">unique</text>
    <text x="285" y="135">password</text><text x="492" y="135" text-anchor="end" fill="#7a7d73" font-size="11">sha1</text>
    <text x="285" y="153">email</text>
    <text x="285" y="171">confirmationcode</text><text x="492" y="171" text-anchor="end" fill="#7a7d73" font-size="11">null = activated</text>
    <text x="285" y="189">phone_id</text><text x="492" y="189" text-anchor="end" fill="#f39a2b" font-size="11" font-weight="700">FK</text>
    <text x="285" y="207">operator_id</text><text x="492" y="207" text-anchor="end" fill="#f39a2b" font-size="11" font-weight="700">FK</text>
    <text x="285" y="225">phonenumber</text>
    <text x="285" y="243">notes</text>
    <text x="285" y="261">disabled</text>
    <text x="285" y="279">administrator</text>
  </g>

  <!-- uploads_users -->
  <g>
    <rect x="275" y="380" width="225" height="80" rx="8" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
    <rect x="275" y="380" width="225" height="26" rx="8" fill="#1d1f1a"/>
    <rect x="275" y="394" width="225" height="12" fill="#1d1f1a"/>
    <text x="387" y="398" text-anchor="middle" fill="#b5d623" font-weight="700">uploads_users</text>
    <text x="285" y="419">upload_id</text><text x="492" y="419" text-anchor="end" fill="#f39a2b" font-size="11" font-weight="700">PK FK</text>
    <text x="285" y="437">user_id</text><text x="492" y="437" text-anchor="end" fill="#f39a2b" font-size="11" font-weight="700">PK FK</text>
    <text x="285" y="455">owner</text><text x="492" y="455" text-anchor="end" fill="#7a7d73" font-size="11">0/1</text>
  </g>

  <!-- uploads -->
  <g>
    <rect x="545" y="60" width="200" height="170" rx="8" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
    <rect x="545" y="60" width="200" height="26" rx="8" fill="#1d1f1a"/>
    <rect x="545" y="74" width="200" height="12" fill="#1d1f1a"/>
    <text x="645" y="78" text-anchor="middle" fill="#b5d623" font-weight="700">uploads</text>
    <text x="555" y="99">id</text><text x="737" y="99" text-anchor="end" fill="#7fa000" font-size="11" font-weight="700">PK</text>
    <text x="555" y="117">title</text>
    <text x="555" y="135">referrer</text><text x="737" y="135" text-anchor="end" fill="#7a7d73" font-size="11">source URL</text>
    <text x="555" y="153">deleted</text><text x="737" y="153" text-anchor="end" fill="#7a7d73" font-size="11">datetime</text>
    <text x="555" y="171">ever_updated</text><text x="737" y="171" text-anchor="end" fill="#7a7d73" font-size="11">joeyd done?</text>
    <text x="555" y="189">errors</text>
    <text x="555" y="207">created</text>
    <text x="555" y="225">modified</text>
  </g>

  <!-- files -->
  <g>
    <rect x="545" y="300" width="200" height="224" rx="8" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
    <rect x="545" y="300" width="200" height="26" rx="8" fill="#1d1f1a"/>
    <rect x="545" y="314" width="200" height="12" fill="#1d1f1a"/>
    <text x="645" y="318" text-anchor="middle" fill="#b5d623" font-weight="700">files</text>
    <text x="555" y="339">id</text><text x="737" y="339" text-anchor="end" fill="#7fa000" font-size="11" font-weight="700">PK</text>
    <text x="555" y="357">upload_id</text><text x="737" y="357" text-anchor="end" fill="#f39a2b" font-size="11" font-weight="700">FK</text>
    <text x="555" y="375">name</text><text x="737" y="375" text-anchor="end" fill="#7a7d73" font-size="11">processed</text>
    <text x="555" y="393">size</text>
    <text x="555" y="411">type</text>
    <text x="555" y="429">original_name</text><text x="737" y="429" text-anchor="end" fill="#7a7d73" font-size="11">as uploaded</text>
    <text x="555" y="447">original_type</text>
    <text x="555" y="465">original_size</text>
    <text x="555" y="483">preview_name</text><text x="737" y="483" text-anchor="end" fill="#7a7d73" font-size="11">thumbnail</text>
    <text x="555" y="501">preview_type</text>
    <text x="555" y="519">preview_size</text>
  </g>

  <!-- contentsourcetypes -->
  <g>
    <rect x="790" y="60" width="190" height="188" rx="8" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
    <rect x="790" y="60" width="190" height="26" rx="8" fill="#1d1f1a"/>
    <rect x="790" y="74" width="190" height="12" fill="#1d1f1a"/>
    <text x="885" y="78" text-anchor="middle" fill="#b5d623" font-weight="700">contentsourcetypes</text>
    <text x="800" y="99">id</text><text x="972" y="99" text-anchor="end" fill="#7fa000" font-size="11" font-weight="700">PK</text>
    <text x="800" y="117">name</text>
    <text x="800" y="135">created</text>
    <text x="800" y="153">modified</text>
    <line x1="790" y1="162" x2="980" y2="162" stroke="#e2e4da"/>
    <text x="800" y="177" fill="#4a4d44" font-size="11" font-weight="700">seeded name values</text>
    <text x="800" y="195" fill="#4a4d44">application/atom+xml</text>
    <text x="800" y="213" fill="#4a4d44">rss-source/text</text>
    <text x="800" y="231" fill="#4a4d44">microsummary/xml</text>
    <text x="800" y="245" fill="#4a4d44">widget/joey</text>
  </g>

  <!-- contentsources -->
  <g>
    <rect x="790" y="300" width="190" height="134" rx="8" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
    <rect x="790" y="300" width="190" height="26" rx="8" fill="#1d1f1a"/>
    <rect x="790" y="314" width="190" height="12" fill="#1d1f1a"/>
    <text x="885" y="318" text-anchor="middle" fill="#b5d623" font-weight="700">contentsources</text>
    <text x="800" y="339">id</text><text x="972" y="339" text-anchor="end" fill="#7fa000" font-size="11" font-weight="700">PK</text>
    <text x="800" y="357">file_id</text><text x="972" y="357" text-anchor="end" fill="#f39a2b" font-size="11" font-weight="700">FK</text>
    <text x="800" y="375">source</text><text x="972" y="375" text-anchor="end" fill="#7a7d73" font-size="11">rss=…, icon=…</text>
    <text x="800" y="393">contentsourcetype_id</text><text x="972" y="393" text-anchor="end" fill="#f39a2b" font-size="11" font-weight="700">FK</text>
    <text x="800" y="411">created</text>
    <text x="800" y="429">modified</text>
  </g>

  <!-- cake_sessions -->
  <g>
    <rect x="790" y="480" width="190" height="80" rx="8" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
    <rect x="790" y="480" width="190" height="26" rx="8" fill="#1d1f1a"/>
    <rect x="790" y="494" width="190" height="12" fill="#1d1f1a"/>
    <text x="885" y="498" text-anchor="middle" fill="#b5d623" font-weight="700">cake_sessions</text>
    <text x="800" y="519">id</text><text x="972" y="519" text-anchor="end" fill="#7a7d73" font-size="11">varchar</text>
    <text x="800" y="537">data</text><text x="972" y="537" text-anchor="end" fill="#7a7d73" font-size="11">text</text>
    <text x="800" y="555">expires</text>
  </g>

  <!-- filesystem -->
  <g>
    <rect x="20" y="450" width="230" height="150" rx="8" fill="#f4f8e2" stroke="#b5d623" stroke-width="1.8"/>
    <text x="135" y="472" text-anchor="middle" font-weight="700">On disk, per user</text>
    <text x="32" y="494" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">UPLOAD_DIR/&lt;user_id&gt;/</text>
    <text x="44" y="512" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">joey-&lt;uniq&gt;.ext</text><text x="150" y="512" fill="#4a4d44" font-size="12">processed file</text>
    <text x="44" y="530" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">originals/</text><text x="150" y="530" fill="#4a4d44" font-size="12">as uploaded</text>
    <text x="44" y="548" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">previews/</text><text x="150" y="548" fill="#4a4d44" font-size="12">PNG thumbnails</text>
    <text x="44" y="566" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">cache/</text><text x="150" y="566" fill="#4a4d44" font-size="12">httplib2, ffmpeg logs</text>
    <text x="32" y="590" fill="#4a4d44" font-size="12">quota: MAX_DISK_USAGE (20 MB) per user</text>
  </g>

  <!-- legend -->
  <g fill="#7a7d73" font-size="12">
    <line x1="560" y1="600" x2="620" y2="600" stroke="#4a4d44" stroke-width="1.5" marker-start="url(#crow)" marker-end="url(#one)"/>
    <text x="630" y="604">child (many) → parent (one); InnoDB foreign keys, files and uploads_users cascade on upload delete</text>
  </g>
</svg>
