<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1d1f1a">
  <title>How one Joey URL renders for each device</title>
  <desc>Decision tree in AppController and UploadsController, plus the first-run welcome page handshake.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4d44"/>
    </marker>
  </defs>
  <rect width="1000" height="660" fill="#fbfbf7"/>

  <g font-size="12" font-weight="700" fill="#7fa000" letter-spacing="1.5">
    <text x="330" y="36" text-anchor="middle">ONE URL, FOUR RENDERINGS:  /uploads/index</text>
    <text x="812" y="36" text-anchor="middle">FIRST-RUN WELCOME PAGE</text>
  </g>
  <line x1="60" y1="46" x2="600" y2="46" stroke="#e2e4da" stroke-width="2"/>
  <line x1="640" y1="46" x2="985" y2="46" stroke="#e2e4da" stroke-width="2"/>

  <!-- start -->
  <rect x="60" y="62" width="240" height="46" rx="23" fill="#1d1f1a"/>
  <text x="180" y="90" text-anchor="middle" fill="#b5d623" font-weight="700">Request arrives (GET or POST)</text>
  <line x1="180" y1="108" x2="180" y2="140" stroke="#4a4d44" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- D1 -->
  <rect x="60" y="140" width="240" height="62" rx="10" fill="#fff7ea" stroke="#f39a2b" stroke-width="1.8"/>
  <text x="180" y="163" text-anchor="middle" font-weight="700">rest parameter present?</text>
  <text x="180" y="181" text-anchor="middle">AppController sets nbClient = true</text>
  <line x1="300" y1="171" x2="340" y2="171" stroke="#4a4d44" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="163" text-anchor="middle" font-size="12" fill="#7fa000" font-weight="700">yes</text>
  <line x1="180" y1="202" x2="180" y2="250" stroke="#4a4d44" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="232" font-size="12" fill="#4a4d44" font-weight="700">no</text>
  <rect x="340" y="140" width="260" height="78" rx="10" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
  <text x="470" y="162" text-anchor="middle" font-weight="700">J2ME MIDlet (rest client)</text>
  <text x="470" y="180" text-anchor="middle">layout = null, view j2me_index:</text>
  <text x="470" y="196" text-anchor="middle">key=value text lines, base64 previews,</text>
  <text x="470" y="212" text-anchor="middle">result in header X-joey-status</text>

  <!-- D2 -->
  <rect x="60" y="250" width="240" height="56" rx="10" fill="#fff7ea" stroke="#f39a2b" stroke-width="1.8"/>
  <text x="180" y="273" text-anchor="middle" font-weight="700">BrowserAgent::isIPhone()?</text>
  <text x="180" y="291" text-anchor="middle">user-agent sniffing (vendors/)</text>
  <line x1="300" y1="278" x2="340" y2="278" stroke="#4a4d44" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#7fa000" font-weight="700">yes</text>
  <line x1="180" y1="306" x2="180" y2="372" stroke="#4a4d44" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="345" font-size="12" fill="#4a4d44" font-weight="700">no</text>
  <rect x="340" y="250" width="260" height="96" rx="10" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
  <text x="470" y="272" text-anchor="middle" font-weight="700">iPhone Safari → iphone layout</text>
  <text x="470" y="290" text-anchor="middle">iui.css + iui.js, viewport width 320,</text>
  <text x="470" y="306" text-anchor="middle">grouped lists: Browser stuff, Videos,</text>
  <text x="470" y="322" text-anchor="middle">Images, Audio, RSS, Text;</text>
  <text x="470" y="338" text-anchor="middle">items open via /files/wrapper/&lt;id&gt;</text>

  <!-- D3 -->
  <rect x="60" y="372" width="240" height="56" rx="10" fill="#fff7ea" stroke="#f39a2b" stroke-width="1.8"/>
  <text x="180" y="395" text-anchor="middle" font-weight="700">BrowserAgent::isMobile()?</text>
  <text x="180" y="413" text-anchor="middle">other phone browsers</text>
  <line x1="300" y1="400" x2="340" y2="400" stroke="#4a4d44" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="392" text-anchor="middle" font-size="12" fill="#7fa000" font-weight="700">yes</text>
  <line x1="180" y1="428" x2="180" y2="500" stroke="#4a4d44" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="470" font-size="12" fill="#4a4d44" font-weight="700">no</text>
  <rect x="340" y="372" width="260" height="104" rx="10" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
  <text x="470" y="394" text-anchor="middle" font-weight="700">WAP phone → mp layout</text>
  <text x="470" y="412" text-anchor="middle">XHTML Mobile Profile 1.0, served as</text>
  <text x="470" y="428" text-anchor="middle">application/vnd.wap.xhtml+xml,</text>
  <text x="470" y="444" text-anchor="middle">mp_joey.css, plain-link pagination</text>
  <text x="470" y="460" text-anchor="middle">(no AJAX), inline image previews</text>

  <!-- default -->
  <rect x="60" y="500" width="540" height="118" rx="10" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
  <text x="330" y="522" text-anchor="middle" font-weight="700">Desktop browser → default layout</text>
  <text x="330" y="541" text-anchor="middle">green.css + joey.css, prototype.js; type filters all / video / audio / images /</text>
  <text x="330" y="557" text-anchor="middle">rss / microsummaries / text; AJAX delete and in-place reload (joeybag.js);</text>
  <text x="330" y="573" text-anchor="middle">inline FLV player (webflv.swf) and MP3 player (musicplayer.swf);</text>
  <text x="330" y="589" text-anchor="middle">thumbnails from /files/view/&lt;id&gt;/preview; Google Analytics (__utm.js)</text>
  <text x="330" y="607" text-anchor="middle" fill="#4a4d44">"get the software", account edit, logout links in the green header</text>

  <!-- right: first-run -->
  <rect x="640" y="62" width="345" height="74" rx="10" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
  <text x="812" y="84" text-anchor="middle" font-weight="700">Add-on starts: first run or new version</text>
  <text x="812" y="102" text-anchor="middle">pref joey.lastversion != 0.3.0.0 → open tab</text>
  <text x="812" y="118" text-anchor="middle">/version/index/0.3.0.0/firstrun</text>
  <line x1="812" y1="136" x2="812" y2="162" stroke="#4a4d44" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="640" y="162" width="345" height="74" rx="10" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
  <text x="812" y="184" text-anchor="middle" font-weight="700">VersionController → joeyclient layout</text>
  <text x="812" y="202" text-anchor="middle">Welcome banner, release_notes/0.3.0.0 panels</text>
  <text x="812" y="218" text-anchor="middle">(Guided Tour, Learn More, Get Involved)</text>
  <line x1="812" y1="236" x2="812" y2="262" stroke="#4a4d44" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="640" y="262" width="345" height="236" rx="10" fill="#f4f8e2" stroke="#b5d623" stroke-width="1.8"/>
  <text x="812" y="284" text-anchor="middle" font-weight="700">"Page talk": DOM-mutation handshake</text>
  <text x="655" y="308">1. add-on inserts div.joeyCallback#joeyIsHere</text>
  <text x="655" y="328">2. page (joeyclient.js) reveals the Guided Tour</text>
  <text x="655" y="348">3. user selects the text "** Send me to Joey **"</text>
  <text x="655" y="368">4. page inserts div.joeyAction#joeySelected?id=123</text>
  <text x="655" y="388">5. add-on remembers callback id 123</text>
  <text x="655" y="408">6. user right-clicks → Joey Selected Text → upload</text>
  <text x="655" y="428">7. on success add-on inserts joeyCallback#node=123</text>
  <text x="655" y="448">8. page shows "Congratulations!"</text>
  <text x="655" y="476" fill="#4a4d44">Safe mode: without the add-on's event the tour stays</text>
  <text x="655" y="492" fill="#4a4d44">hidden and the page is a plain release-notes page.</text>

  <rect x="640" y="520" width="345" height="98" rx="10" fill="#fff" stroke="#4a4d44" stroke-width="1.5"/>
  <text x="812" y="542" text-anchor="middle" font-weight="700">Shared by every rendering</text>
  <text x="812" y="560" text-anchor="middle">AppController::checkSession: no session →</text>
  <text x="812" y="576" text-anchor="middle">rest clients get X-joey-status 511,</text>
  <text x="812" y="592" text-anchor="middle">browsers redirect to /users/login and</text>
  <text x="812" y="608" text-anchor="middle">return to login_referrer afterwards</text>
</svg>
